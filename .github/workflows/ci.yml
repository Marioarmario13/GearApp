name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Supabase local (Docker) só com o necessário: Postgres, Auth, REST, Storage e gateway.
      # Aplica migrações + seed; depois pgTAP e testes de integração (API + Storage reais).
      - run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run test:integration
      # Tipos gerados precisam refletir as migrações commitadas.
      - run: npm run db:types && git diff --exit-code packages/shared/src/database.types.ts
